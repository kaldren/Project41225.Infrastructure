# Deploy terraform code to dev environment on Azure
# This workflow is triggered on push to the main branch
# It runs the terraform code to deploy the infrastructure to the dev environment

name: Deploy to Dev
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: e0d4c085-a3ad-4694-bfd7-f4486656cdab
          tenant-id: 06209c3c-8ca6-4b1e-96a1-f2458effd850
          subscription-id: 25a1ac98-4092-4447-9085-2aeaec93d823
          audience: api://AzureADTokenExchange

      - name: Print current identity
        run: az account show

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./envs/dev

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./envs/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./envs/dev

      - name: Notify deployment success
        run: echo "Deployment to dev environment successful!"
