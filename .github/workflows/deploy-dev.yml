# Deploy terraform code to dev environment on Azure
# This workflow is triggered on push to the main branch
# It runs the terraform code to deploy the infrastructure to the dev environment

name: Deploy to Dev
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./envs/dev

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./envs/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./envs/dev

      - name: Notify deployment success
        run: echo "Deployment to dev environment successful!"
