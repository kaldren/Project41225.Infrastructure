# Deploy terraform code to dev environment on Azure
# This workflow is triggered on push to the main branch
# It runs the terraform code to deploy the infrastructure to the dev environment

name: Deploy to Dev
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Export ARM_* env vars for Terraform
        run: |
          export ARM_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          export ARM_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}"
          export ARM_SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          export ARM_USE_OIDC=true
          terraform init
        working-directory: ./envs/dev

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./envs/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./envs/dev

      - name: Notify deployment success
        run: echo "Deployment to dev environment successful!"
